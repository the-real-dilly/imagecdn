<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Data Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --bg: #0b1020;
  --panel: rgba(255,255,255,0.04);
  --panel-border: rgba(255,255,255,0.08);
  --text: #e6edf3;
  --subtle: #9da7b3;
  --accent: #4f8cff;
  --accent-soft: rgba(79,140,255,0.15);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  background: radial-gradient(circle at top left, #111933, #0b1020 60%);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px 28px;
  font-size: 18px;
  font-weight: 600;
  border-bottom: 1px solid var(--panel-border);
  backdrop-filter: blur(8px);
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 40px 0 120px 0;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.message {
  width: 100%;
  display: flex;
  justify-content: center;
  animation: fadeUp 0.25s ease;
}

.message-inner {
  width: 100%;
  max-width: 780px;
  padding: 0 24px;
}

.bubble {
  padding: 18px 22px;
  border-radius: 18px;
  line-height: 1.6;
  font-size: 15px;
}

.user .bubble {
  background: var(--accent);
  color: white;
  margin-left: auto;
  width: fit-content;
  max-width: 70%;
  border-bottom-right-radius: 6px;
}

.assistant .bubble {
  background: transparent;
  padding-left: 0;
  padding-right: 0;
}

.data-card {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 18px;
  padding: 22px;
  backdrop-filter: blur(12px);
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 16px;
}

th {
  text-align: left;
  font-weight: 500;
  color: var(--subtle);
  font-size: 13px;
  padding-bottom: 10px;
}

td {
  padding: 8px 0;
  font-size: 14px;
}

.visual-options {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.visual-options button {
  background: transparent;
  border: 1px solid var(--panel-border);
  color: var(--subtle);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s ease;
}

.visual-options button:hover {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}

canvas {
  margin-top: 20px;
  max-height: 320px;
}

.input-bar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 820px;
  padding: 0 24px;
}

.input-inner {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 18px;
  padding: 10px;
  display: flex;
  backdrop-filter: blur(12px);
}

input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 15px;
  padding: 10px;
}

button.send {
  background: var(--accent);
  border: none;
  padding: 10px 18px;
  border-radius: 12px;
  color: white;
  cursor: pointer;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header>AI Data Assistant</header>

<div class="chat" id="chat"></div>

<div class="input-bar">
  <div class="input-inner">
    <input id="question" placeholder="Ask about your data..." />
    <button class="send" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
let chartInstance = null;
let lastData = null;

/* ---------------- MOCK DATA ---------------- */

function getMockResponse(q) {
  q = q.toLowerCase();

  if (q.includes("file types")) {
    return {
      columns: ["File Type", "Count"],
      rows: [
        ["MOV", 4200],
        ["PNG", 3200],
        ["JPG", 2100],
        ["MP4", 1800]
      ]
    };
  }

  if (q.includes("storage")) {
    return {
      columns: ["Month", "Storage (GB)"],
      rows: [
        ["Jan", 120],
        ["Feb", 160],
        ["Mar", 210],
        ["Apr", 280],
        ["May", 340]
      ]
    };
  }

  return {
    columns: ["Metric", "Value"],
    rows: [
      ["Files Processed", 12432],
      ["Active Streams", 382],
      ["Errors", 12]
    ]
  };
}

/* ---------------- CHAT LOGIC ---------------- */

function addMessage(role, contentHTML) {
  const chat = document.getElementById("chat");

  const msg = document.createElement("div");
  msg.className = "message " + role;

  const inner = document.createElement("div");
  inner.className = "message-inner";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = contentHTML;

  inner.appendChild(bubble);
  msg.appendChild(inner);
  chat.appendChild(msg);

  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById("question");
  const q = input.value.trim();
  if (!q) return;

  input.value = "";

  addMessage("user", q);

  setTimeout(() => {
    const data = getMockResponse(q);
    lastData = data;
    renderData(data);
  }, 600);
}

/* ---------------- DATA RENDER ---------------- */

function renderData(data) {
  let html = `<div class="data-card">`;

  html += `<table><thead><tr>`;
  data.columns.forEach(c => html += `<th>${c}</th>`);
  html += `</tr></thead><tbody>`;

  data.rows.forEach(r => {
    html += "<tr>";
    r.forEach(cell => html += `<td>${cell}</td>`);
    html += "</tr>";
  });

  html += `</tbody></table>`;

  html += `
    <div class="visual-options">
      <button onclick="renderChart('bar')">Bar</button>
      <button onclick="renderChart('line')">Line</button>
      <button onclick="renderChart('pie')">Pie</button>
      <button onclick="renderChart('table')">Table</button>
    </div>

    <canvas id="chartCanvas"></canvas>
  `;

  html += `</div>`;

  addMessage("assistant", html);
}

/* ---------------- CHART ---------------- */

function renderChart(type) {
  if (!lastData) return;

  const canvas = document.getElementById("chartCanvas");

  if (chartInstance) chartInstance.destroy();

  if (type === "table") {
    canvas.style.display = "none";
    return;
  }

  canvas.style.display = "block";

  chartInstance = new Chart(canvas, {
    type: type,
    data: {
      labels: lastData.rows.map(r => r[0]),
      datasets: [{
        label: lastData.columns[1],
        data: lastData.rows.map(r => r[1])
      }]
    }
  });
}
</script>

</body>
</html>
