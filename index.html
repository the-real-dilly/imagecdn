<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Data Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f172a;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 16px;
  font-size: 18px;
  font-weight: 600;
  border-bottom: 1px solid #1e293b;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.message {
  display: flex;
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 70%;
  padding: 14px 18px;
  border-radius: 14px;
  line-height: 1.4;
  animation: fadeIn 0.2s ease-in-out;
}

.user .bubble {
  background: #2563eb;
}

.assistant .bubble {
  background: #1e293b;
}

.typing::after {
  content: "...";
  animation: blink 1s infinite;
}

@keyframes blink {
  0% { opacity: 0.2; }
  50% { opacity: 1; }
  100% { opacity: 0.2; }
}

table {
  width: 100%;
  margin-top: 12px;
  border-collapse: collapse;
}

th, td {
  padding: 8px;
  border-bottom: 1px solid #334155;
  text-align: left;
}

select {
  margin-top: 12px;
  padding: 6px;
  background: #0f172a;
  color: white;
  border: 1px solid #334155;
  border-radius: 6px;
}

canvas {
  margin-top: 16px;
  max-height: 300px;
}

.controls {
  display: flex;
  border-top: 1px solid #1e293b;
  padding: 14px;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px;
  background: #1e293b;
  border: none;
  border-radius: 8px;
  color: white;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

.regenerate {
  margin-top: 10px;
  font-size: 13px;
  opacity: 0.7;
  cursor: pointer;
}

.regenerate:hover {
  opacity: 1;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header>AI Data Assistant</header>

<div class="chat" id="chat"></div>

<div class="controls">
  <input id="question" placeholder="Ask about your database..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
let chartInstance = null;
let lastQuestion = null;

/* ------------------ MOCK ROUTING ------------------ */

function getMockResponse(question) {
  question = question.toLowerCase();

  if (question.includes("largest table")) {
    return {
      columns: ["table_name", "row_count"],
      rows: [
        ["files", 12093],
        ["out_files", 8293],
        ["in_files", 5231]
      ]
    };
  }

  if (question.includes("file types")) {
    return {
      columns: ["file_type", "count"],
      rows: [
        ["mov", 4200],
        ["png", 3200],
        ["jpg", 2100],
        ["mp4", 1800]
      ]
    };
  }

  if (question.includes("storage")) {
    return {
      columns: ["month", "storage_gb"],
      rows: [
        ["Jan", 120],
        ["Feb", 140],
        ["Mar", 210],
        ["Apr", 260],
        ["May", 310]
      ]
    };
  }

  return {
    columns: ["result"],
    rows: [["System processed request successfully."]]
  };
}

/* ------------------ CHAT LOGIC ------------------ */

function addMessage(content, role="assistant", isHTML=false) {
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = `message ${role}`;

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if (isHTML) bubble.innerHTML = content;
  else bubble.textContent = content;

  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;

  return bubble;
}

function streamText(element, text, callback) {
  let i = 0;
  element.textContent = "";
  const interval = setInterval(() => {
    element.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(interval);
      callback();
    }
  }, 12);
}

function sendMessage() {
  const input = document.getElementById("question");
  const question = input.value.trim();
  if (!question) return;

  lastQuestion = question;
  input.value = "";

  addMessage(question, "user");

  const typing = addMessage("Analyzing data", "assistant");
  typing.classList.add("typing");

  setTimeout(() => {
    typing.remove();

    const data = getMockResponse(question);
    renderResponse(data);

  }, 800);
}

function regenerate() {
  if (!lastQuestion) return;
  sendMessageFromRegenerate(lastQuestion);
}

function sendMessageFromRegenerate(question) {
  const typing = addMessage("Reprocessing request", "assistant");
  typing.classList.add("typing");

  setTimeout(() => {
    typing.remove();
    const data = getMockResponse(question);
    renderResponse(data);
  }, 800);
}

/* ------------------ RENDER ------------------ */

function renderResponse(data) {
  let html = `<strong>Results:</strong><br><br>`;

  html += `<table><thead><tr>`;
  data.columns.forEach(col => html += `<th>${col}</th>`);
  html += `</tr></thead><tbody>`;

  data.rows.forEach(row => {
    html += "<tr>";
    row.forEach(cell => html += `<td>${cell}</td>`);
    html += "</tr>";
  });

  html += `</tbody></table>`;

  html += `
    <select onchange="renderChart(this, '${encodeURIComponent(JSON.stringify(data))}')">
      <option value="table">Table</option>
      <option value="bar">Bar Chart</option>
      <option value="line">Line Chart</option>
      <option value="pie">Pie Chart</option>
    </select>
    <canvas></canvas>
    <div class="regenerate" onclick="regenerate()">Regenerate response</div>
  `;

  addMessage(html, "assistant", true);
}

/* ------------------ CHARTS ------------------ */

function renderChart(selectEl, encoded) {
  const data = JSON.parse(decodeURIComponent(encoded));
  const type = selectEl.value;

  const bubble = selectEl.parentElement;
  const canvas = bubble.querySelector("canvas");

  if (chartInstance) chartInstance.destroy();

  if (type === "table") {
    canvas.style.display = "none";
    return;
  }

  canvas.style.display = "block";

  const labels = data.rows.map(r => r[0]);
  const values = data.rows.map(r => r[1]);

  chartInstance = new Chart(canvas, {
    type: type,
    data: {
      labels: labels,
      datasets: [{
        label: data.columns[1] || "Value",
        data: values
      }]
    }
  });
}
</script>

</body>
</html>
