<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dilly AI SQL Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0f172a;
--sidebar:#111827;
--assistant:#1f2937;
--user:#374151;
--input:#0b1220;
--border:#2a3441;
--text:#e5e7eb;
--accent:#10a37f;
}

*{box-sizing:border-box;}
body{
margin:0;
font-family:"Inter",sans-serif;
background:var(--bg);
color:var(--text);
display:flex;
height:100vh;
overflow:hidden;
}

/* Sidebar */
.sidebar{
width:260px;
background:var(--sidebar);
border-right:1px solid var(--border);
padding:20px;
display:flex;
flex-direction:column;
}
.sidebar h2{
font-size:16px;
margin-bottom:20px;
}
.history-item{
padding:10px;
border-radius:8px;
cursor:pointer;
font-size:14px;
margin-bottom:8px;
background:rgba(255,255,255,0.03);
}
.history-item:hover{
background:rgba(255,255,255,0.08);
}

/* Chat Area */
.main{
flex:1;
display:flex;
flex-direction:column;
}
.chat{
flex:1;
overflow-y:auto;
padding:40px;
max-width:900px;
margin:auto;
width:100%;
}
.message{
margin-bottom:20px;
display:flex;
animation:fade 0.3s ease;
}
.message.user{justify-content:flex-end;}
.bubble{
max-width:75%;
padding:16px;
border-radius:18px;
line-height:1.5;
}
.user .bubble{background:var(--user);}
.assistant .bubble{background:var(--assistant);}

.input-bar{
border-top:1px solid var(--border);
padding:20px;
display:flex;
justify-content:center;
background:var(--sidebar);
}
.input-wrapper{
max-width:900px;
width:100%;
display:flex;
gap:10px;
}
input{
flex:1;
padding:14px;
border-radius:12px;
border:1px solid var(--border);
background:var(--input);
color:white;
outline:none;
}
button{
padding:12px 18px;
border:none;
border-radius:12px;
background:var(--accent);
color:white;
font-weight:600;
cursor:pointer;
}
button:hover{opacity:0.9;}

.typing-dots span{
animation:blink 1.4s infinite both;
}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}

@keyframes blink{
0%{opacity:.2;}
20%{opacity:1;}
100%{opacity:.2;}
}

@keyframes fade{
from{opacity:0;transform:translateY(6px);}
to{opacity:1;transform:translateY(0);}
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
font-size:14px;
}
th,td{
padding:8px;
border-bottom:1px solid var(--border);
}

select{
margin-top:15px;
padding:6px;
background:var(--input);
color:white;
border:1px solid var(--border);
border-radius:6px;
}

pre{
background:#0b1220;
padding:12px;
border-radius:8px;
font-size:13px;
overflow-x:auto;
}

.controls{
margin-top:10px;
display:flex;
gap:10px;
flex-wrap:wrap;
}
.controls button{
background:#334155;
}
canvas{
margin-top:20px;
}

</style>
</head>
<body>

<div class="sidebar">
<h2>Conversations</h2>
<div id="history"></div>
</div>

<div class="main">
<div class="chat" id="chat"></div>

<div class="input-bar">
<div class="input-wrapper">
<input id="question" placeholder="Ask your database anything..." />
<button onclick="sendMessage()">Send</button>
</div>
</div>
</div>

<script>
let chartInstance=null;
let conversationHistory=[];

/* ---------------- MOCK DATA ---------------- */

function getMockResponse(question){
question=question.toLowerCase();

if(question.includes("largest")){
return{
sql:"SELECT table_name, COUNT(*) AS row_count FROM tables GROUP BY table_name ORDER BY row_count DESC LIMIT 5;",
columns:["table_name","row_count"],
rows:[["files",12093],["out_files",8293],["in_files",5231]]
};
}

if(question.includes("types")){
return{
sql:"SELECT file_type, COUNT(*) FROM files GROUP BY file_type;",
columns:["file_type","count"],
rows:[["mov",4200],["png",3200],["jpg",2100],["mp4",1800]]
};
}

if(question.includes("storage")){
return{
sql:"SELECT month, storage_gb FROM storage_growth;",
columns:["month","storage_gb"],
rows:[["Jan",120],["Feb",140],["Mar",210],["Apr",260],["May",310]]
};
}

return{
sql:"SELECT 'Demo response' AS result;",
columns:["result"],
rows:[["Demo response"]]
};
}

/* ---------------- CHAT UI ---------------- */

function addMessage(content,role="assistant",isHTML=false){
const chat=document.getElementById("chat");
const message=document.createElement("div");
message.className=`message ${role}`;
const bubble=document.createElement("div");
bubble.className="bubble";
if(isHTML)bubble.innerHTML=content;
else bubble.textContent=content;
message.appendChild(bubble);
chat.appendChild(message);
chat.scrollTop=chat.scrollHeight;
return bubble;
}

function addHistoryItem(text){
const history=document.getElementById("history");
const item=document.createElement("div");
item.className="history-item";
item.textContent=text;
history.prepend(item);
}

function sendMessage(){
const input=document.getElementById("question");
const question=input.value.trim();
if(!question)return;
input.value="";
addMessage(question,"user");
addHistoryItem(question);

const typing=addMessage(
`Analyzing<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>`,
"assistant",true);

setTimeout(()=>{
typing.remove();
const data=getMockResponse(question);
renderAssistantResponse(data);
},1000);
}

/* ------------- RENDER RESPONSE ------------- */

function renderAssistantResponse(data){
let html="";

html+=`<div><strong>SQL Generated:</strong></div>`;
html+=`<pre>${data.sql}</pre>`;

html+=`<div><strong>Results:</strong></div>`;
html+=`<table><thead><tr>`;
data.columns.forEach(c=>html+=`<th>${c}</th>`);
html+=`</tr></thead><tbody>`;
data.rows.forEach(r=>{
html+="<tr>";
r.forEach(cell=>html+=`<td>${cell}</td>`);
html+="</tr>";
});
html+="</tbody></table>";

html+=`
<select onchange="renderChart(this, ${encodeURIComponent(JSON.stringify(data))})">
<option value="table">Table</option>
<option value="bar">Bar Chart</option>
<option value="line">Line Chart</option>
<option value="pie">Pie Chart</option>
</select>
<canvas></canvas>

<div class="controls">
<button onclick="downloadCSV(${encodeURIComponent(JSON.stringify(data))})">Download CSV</button>
<button onclick="regenerate()">Regenerate</button>
<button onclick="copySQL('${data.sql.replace(/'/g,"\\'")}')">Copy SQL</button>
</div>
`;

addMessage(html,"assistant",true);
}

/* ------------- UTILITIES ------------- */

function renderChart(selectEl,encoded){
const data=JSON.parse(decodeURIComponent(encoded));
const type=selectEl.value;
const bubble=selectEl.parentElement;
const canvas=bubble.querySelector("canvas");
if(chartInstance)chartInstance.destroy();
if(type==="table"){canvas.style.display="none";return;}
canvas.style.display="block";
chartInstance=new Chart(canvas,{
type:type,
data:{
labels:data.rows.map(r=>r[0]),
datasets:[{label:data.columns[1]||"Value",data:data.rows.map(r=>r[1])}]
}
});
}

function downloadCSV(encoded){
const data=JSON.parse(decodeURIComponent(encoded));
let csv=data.columns.join(",")+"\n";
data.rows.forEach(r=>csv+=r.join(",")+"\n");
const blob=new Blob([csv],{type:"text/csv"});
const link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="results.csv";
link.click();
}

function regenerate(){
addMessage("Regenerating response...","assistant");
}

function copySQL(sql){
navigator.clipboard.writeText(sql);
alert("SQL copied!");
}
</script>

</body>
</html>
