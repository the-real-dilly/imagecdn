<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Data Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --bg: #0b1020;
  --panel: rgba(255,255,255,0.05);
  --border: rgba(255,255,255,0.08);
  --text: #e8eefc;
  --subtle: #9aa4b2;
  --accent: #4f8cff;
  --accent-soft: rgba(79,140,255,0.15);
}

.light {
  --bg: #f5f7fb;
  --panel: rgba(0,0,0,0.04);
  --border: rgba(0,0,0,0.08);
  --text: #111827;
  --subtle: #6b7280;
  --accent: #2563eb;
  --accent-soft: rgba(37,99,235,0.15);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: background 0.3s ease;
}

header {
  padding: 18px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

header button {
  background: transparent;
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  color: var(--subtle);
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 40px 0 140px 0;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.message {
  display: flex;
  justify-content: center;
  animation: fadeUp 0.25s ease;
}

.inner {
  max-width: 820px;
  width: 100%;
  padding: 0 24px;
}

.user .bubble {
  background: var(--accent);
  color: white;
  padding: 14px 20px;
  border-radius: 18px;
  max-width: 70%;
  margin-left: auto;
}

.assistant .bubble {
  background: transparent;
}

.data-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  backdrop-filter: blur(12px);
}

.summary {
  font-size: 15px;
  margin-bottom: 18px;
  color: var(--subtle);
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  text-align: left;
  font-weight: 500;
  font-size: 13px;
  color: var(--subtle);
  padding-bottom: 10px;
}

td {
  padding: 8px 0;
}

.visuals {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.visuals button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--subtle);
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s ease;
}

.visuals button:hover {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}

canvas {
  margin-top: 22px;
  max-height: 320px;
}

.input-wrap {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 820px;
  padding: 0 24px;
}

.input-inner {
  display: flex;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 10px;
}

input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  font-size: 15px;
  padding: 10px;
  color: var(--text);
}

button.send {
  background: var(--accent);
  border: none;
  padding: 10px 18px;
  border-radius: 14px;
  color: white;
  cursor: pointer;
}

.shimmer {
  height: 80px;
  border-radius: 16px;
  background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<header>
  <div>AI Data Assistant</div>
  <button onclick="toggleTheme()">Toggle Theme</button>
</header>

<div class="chat" id="chat"></div>

<div class="input-wrap">
  <div class="input-inner">
    <input id="question" placeholder="Ask about your data..." />
    <button class="send" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
let chartInstance = null;
let currentData = null;

/* ---------------- MOCK DATA ---------------- */

function getMockData(q){
  q = q.toLowerCase();

  if(q.includes("file")){
    return {
      columns:["File Type","Count"],
      rows:[["MOV",4200],["PNG",3200],["JPG",2100],["MP4",1800]]
    }
  }

  if(q.includes("storage")){
    return {
      columns:["Month","Storage GB"],
      rows:[["Jan",120],["Feb",160],["Mar",210],["Apr",280],["May",340]]
    }
  }

  return {
    columns:["Metric","Value"],
    rows:[["Files Processed",12432],["Active Streams",382],["Errors",12]]
  }
}

/* ---------------- CHAT ---------------- */

function addMessage(role, html){
  const chat = document.getElementById("chat");
  const msg = document.createElement("div");
  msg.className = "message " + role;

  const inner = document.createElement("div");
  inner.className = "inner";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = html;

  inner.appendChild(bubble);
  msg.appendChild(inner);
  chat.appendChild(msg);

  chat.scrollTop = chat.scrollHeight;
}

function sendMessage(){
  const input = document.getElementById("question");
  const q = input.value.trim();
  if(!q) return;
  input.value = "";

  addMessage("user", q);
  addMessage("assistant", "<div class='shimmer'></div>");

  setTimeout(()=>{
    currentData = getMockData(q);
    renderResponse(currentData);
  }, 900);
}

/* ---------------- RENDER ---------------- */

function renderResponse(data){

  const summary = generateSummary(data);

  let html = `<div class="data-card">
    <div class="summary">${summary}</div>`;

  html += "<table><thead><tr>";
  data.columns.forEach(c=> html += `<th>${c}</th>`);
  html += "</tr></thead><tbody>";

  data.rows.forEach(r=>{
    html+="<tr>";
    r.forEach(cell=> html+=`<td>${cell}</td>`);
    html+="</tr>";
  });

  html+="</tbody></table>";

  html += `
    <div class="visuals">
      <button onclick="renderChart('bar')">Bar</button>
      <button onclick="renderChart('line')">Line</button>
      <button onclick="renderChart('pie')">Pie</button>
      <button onclick="downloadCSV()">Download CSV</button>
      <button onclick="downloadPNG()">Download PNG</button>
    </div>

    <canvas id="chartCanvas"></canvas>
  </div>`;

  document.querySelector(".assistant:last-child .bubble").innerHTML = html;
}

/* ---------------- SUMMARY ---------------- */

function generateSummary(data){
  const total = data.rows.reduce((sum,r)=>sum + r[1],0);
  const max = data.rows.reduce((a,b)=> a[1]>b[1]?a:b);
  return `Summary: Total ${data.columns[1]} is ${total.toLocaleString()}. Highest value is ${max[0]} at ${max[1].toLocaleString()}.`;
}

/* ---------------- CHART ---------------- */

function renderChart(type){
  const canvas = document.getElementById("chartCanvas");
  if(chartInstance) chartInstance.destroy();

  chartInstance = new Chart(canvas,{
    type:type,
    data:{
      labels: currentData.rows.map(r=>r[0]),
      datasets:[{
        label: currentData.columns[1],
        data: currentData.rows.map(r=>r[1])
      }]
    },
    options:{
      animation:{duration:800},
      responsive:true
    }
  });
}

/* ---------------- DOWNLOADS ---------------- */

function downloadCSV(){
  let csv = currentData.columns.join(",") + "\n";
  currentData.rows.forEach(r=> csv+=r.join(",")+"\n");

  const blob = new Blob([csv],{type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download="data.csv";
  a.click();
}

function downloadPNG(){
  const canvas = document.getElementById("chartCanvas");
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download="chart.png";
  a.click();
}

/* ---------------- THEME ---------------- */

function toggleTheme(){
  document.body.classList.toggle("light");
}
</script>

</body>
</html>
